<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漁很大 - 即時開房點餐趴</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --primary: #3b82f6;
      --accent: #f59e0b;
      --danger: #ef4444;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --text-sub: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 26px; color: #60a5fa; }
    
    /* 房間資訊卡 */
    .room-bar {
      max-width: 1200px;
      margin: 0 auto 16px;
      background: var(--card);
      border-radius: 12px;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #334155;
    }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: bold; background: #065f46; color: #6ee7b7; }
    .btn-room { background: var(--primary); border: none; color: white; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }

    /* 雙欄排版 */
    .layout {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
    }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

    .panel { background: var(--card); border-radius: 12px; padding: 18px; border: 1px solid #334155; }
    
    /* 隨機拉霸按鈕 */
    .slot-box {
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      border: 2px dashed #818cf8;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-slot { background: var(--accent); color: #000; font-weight: 800; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }

    /* 菜單列 */
    .filter-box { display: flex; gap: 10px; margin-bottom: 14px; }
    select { flex: 1; padding: 10px; border-radius: 8px; background: #0f172a; color: #fff; border: 1px solid #475569; font-size: 15px; }
    
    .item-card {
      display: flex; justify-content: space-between; align-items: center;
      background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 8px;
      border: 1px solid #334155;
    }
    .item-name { font-weight: bold; font-size: 15px; }
    .item-price { color: #f87171; font-weight: 800; font-size: 14px; margin-top: 2px; }
    
    .btn-add {
      background: var(--primary); border: none; color: white;
      padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;
      transition: transform 0.1s;
    }
    .btn-add:active { transform: scale(0.95); }

    /* 購物車 */
    .cart-box { position: sticky; top: 16px; }
    .cart-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid #334155; font-size: 14px;
    }
    .who-tag { font-size: 11px; background: #334155; color: #93c5fd; padding: 2px 6px; border-radius: 4px; margin-right: 4px; }
    .total-price { font-size: 28px; font-weight: 900; color: #f87171; }
    
    /* 叮咚彈跳通知 */
    #toast {
      position: fixed; top: 20px; right: 20px;
      background: #f59e0b; color: #000; font-weight: bold;
      padding: 12px 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      display: none; z-index: 999; animation: bounce 0.3s;
    }
    @keyframes bounce { 0% { transform: translateY(-20px); } 100% { transform: translateY(0); } }
  </style>
</head>
<body>

  <div id="toast">🔔 通知訊息</div>

  <div class="header">
    <h1>🍻 漁很大 多人連線點餐趴</h1>
    <p style="color:var(--text-sub); font-size:13px;">免帳號・開房即時同步・誰搶菜一清二楚</p>
  </div>

  <div class="room-bar">
    <div>
      連線狀態：<span class="badge" id="netStatus">連線中...</span>
      <span style="margin-left: 12px; font-size:14px; color:#93c5fd;">我是：<strong id="myNick">訪客</strong></span>
    </div>
    <button class="btn-room" onclick="shareRoom()">📋 複製邀請連結發群組</button>
  </div>

  <div class="layout">
    <!-- 菜單 -->
    <div class="panel">
      <!-- 選擇障礙拉霸 -->
      <div class="slot-box">
        <div>
          <div style="font-weight:bold; font-size:14px;">🎲 選擇障礙救星</div>
          <div id="slotResult" style="font-size:12px; color:#cbd5e1;">點擊拉霸，隨機抽一道！</div>
        </div>
        <button class="btn-slot" onclick="rollSlot()">🎰 幫我抽一道！</button>
      </div>

      <div class="filter-box">
        <select id="catSelect" onchange="renderMenu()">
          <option value="ALL">★ 全部類別</option>
        </select>
      </div>

      <div id="menuList"></div>
    </div>

    <!-- 購物車 -->
    <div class="panel cart-box">
      <h2 style="font-size:18px; margin-bottom:12px;">即時合菜清單</h2>
      <div id="cartItems" style="max-height:360px; overflow-y:auto; margin-bottom:12px;">
        <div style="text-align:center; color:#64748b; padding:30px 0;">目前還沒有人點菜喔！</div>
      </div>

      <div style="border-top:1px solid #334155; padding-top:14px; display:flex; justify-content:space-between; align-items:baseline;">
        <span style="font-weight:bold;">全桌合計</span>
        <span class="total-price">NT$ <span id="totalPrice">0</span></span>
      </div>

      <button style="width:100%; background:#10b981; color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer; margin-top:12px;" onclick="copyOrder()">📋 複製最終點菜清單 (貼 LINE)</button>
      <button style="width:100%; background:transparent; border:1px solid #475569; color:#94a3b8; padding:8px; border-radius:8px; font-size:12px; cursor:pointer; margin-top:8px;" onclick="clearAll()">清空重選</button>
    </div>
  </div>

  <script>
    const menu = {
      "漁很大 熱炒": [["沙茶炒牛肉",250],["沙茶炒羊肉",250],["蒜泥白肉",200],["麻辣鴨血",160],["菜脯煎蛋",180],["金沙豆腐",200],["薑絲大腸",200],["金沙杏鮑菇",200],["芹菜鵝腸",200],["豆干肉絲",200],["糖醋排骨",220],["橙汁排骨",220],["塔香螺肉",220],["塔香海瓜子",220],["塔香炒蛤蜊",220],["五更腸旺",250],["蒜泥鮮蚵",250],["客家小炒",250],["蔥爆牛肉",250],["蔥爆羊肉",250],["豆干牛肉",250],["蒜苗臘肉",250],["鴨血肥腸煲",250],["麻辣牛筋煲",250],["麻辣魚片煲",250],["滑蛋蝦仁",280],["豆豉鮮蚵",250],["蒜苗炒松阪",320],["麻油炒松阪",320],["蘆筍炒蝦仁",300],["川燙極品蝦",300],["紅燒魚翅頭",350]],
      "漁很大 熱門菜色": [["老兵麵筋",220],["招牌芝麻雞",250],["醬爆牛筋",250],["串刁二層肉",250],["酥炸魷魠",250],["四季椒鹽海陸",280],["腸旺臭豆腐",280],["威士忌火焰牛",350],["胡椒活鳳螺",500]],
      "漁很大 鮮魚": [["糖醋魚片",250],["豆酥蝶魚",450],["清蒸鱸魚",450],["清蒸海鱸魚",450]],
      "三杯類": [["三杯皮蛋",220],["三杯豆腐",220],["三杯田雞",350],["三杯中卷",350],["三杯土雞 (推薦)",450]],
      "鐵板類": [["鐵板豆腐",220],["鐵板鮮蚵",280],["鐵板牛柳",280],["鐵板牛筋 (推薦)",280],["鐵板蝦仁",300],["鐵板松阪肉",320]],
      "宮保類": [["宮保皮蛋",220],["宮保豆腐",220],["宮保牛柳",250],["宮保雞丁 (推薦)",250]],
      "冷盤類": [["和風洋蔥",120],["日式和風鱈魚肝",250],["招牌油雞 (推薦)",380],["蘆筍沙拉",300],["綜合生魚片",350],["旗魚生魚片",350],["鮭魚生魚片 (推薦)",450]],
      "鹽酥類": [["月亮蝦餅 (推薦)",220],["鹽酥龍珠",250],["香酥紅燒鰻",250],["椒鹽排骨",220],["脆皮肥腸",250],["四季肥腸 (推薦)",250],["酥炸鮮蚵",250],["鳳梨蝦球 (推薦)",300],["金沙中卷 (推薦)",250],["金沙鮮蝦",300],["鹽酥鮮蝦",300]],
      "燒烤類": [["烤日式鯖魚",180],["烤魚下巴",180],["檸檬烤雞翅 (推薦)",180],["烤鹽豬肉",280],["鹽烤松阪豬",320],["花魚一夜干 (推薦)",300],["鹽烤帶骨牛排 (推薦)",380]],
      "時蔬": [["當季時蔬",120],["梨山高麗菜",120],["蛤仔絲瓜",180],["苦瓜鹽蛋",180],["有機水蓮根",180]],
      "飯、麵類": [["白飯",10],["肉絲炒飯",90],["肉絲炒麵",90],["牛肉炒飯",120],["牛肉炒麵",120],["蝦仁炒飯",120],["蝦仁炒麵",120]],
      "火鍋・湯品": [["蛤仔湯",200],["味噌魚湯",220],["酸菜蚵仔湯",220],["田雞蛤仔湯",380],["黃金鍋 (小)",380],["黃金鍋 (大)",680],["蒜頭蛤仔雞湯",680],["剝皮辣椒雞湯",680],["中卷米粉湯",680],["砂鍋魚頭鍋",780]]
    };

    let nickname = prompt("請輸入您的點餐暱稱：", "吃貨" + Math.floor(Math.random()*90+10)) || "神秘客";
    document.getElementById("myNick").innerText = nickname;

    let cart = {}; // { name: { price, qty, users: [] } }
    let peer = null;
    let conns = []; // 房長存的連線列表
    let hostConn = null; // 團員連到房長的線
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room');

    // 初始化 PeerJS
    if (!roomId) {
      // 👑 房長開房
      peer = new Peer();
      peer.on('open', id => {
        document.getElementById("netStatus").innerText = "👑 房長 (已開房)";
        window.history.replaceState({}, '', `?room=${id}`);
      });
      peer.on('connection', conn => {
        conns.push(conn);
        conn.on('data', data => handleIncomingData(data, conn));
      });
    } else {
      // 🙋 團員進房
      peer = new Peer();
      peer.on('open', () => {
        document.getElementById("netStatus").innerText = "🙋 已加入房間";
        hostConn = peer.connect(roomId);
        hostConn.on('open', () => {
          hostConn.send({ type: 'JOIN', user: nickname });
        });
        hostConn.on('data', data => handleIncomingData(data));
      });
    }

    function handleIncomingData(data, fromConn) {
      if (data.type === 'SYNC') {
        cart = data.cart;
        renderCartUI();
        if (data.msg) showToast(data.msg);
      } else if (data.type === 'ACTION') {
        // 房長接收團員點餐，更新後廣播給所有人
        updateCart(data.item, data.price, data.user);
        broadcastCart(`🔔 ${data.user} 點了 ${data.item}！`);
      } else if (data.type === 'CLEAR') {
        cart = {};
        renderCartUI();
        if (conns.length > 0) broadcastCart(`🗑️ ${data.user} 清空了菜單！`);
      }
    }

    function broadcastCart(msg) {
      renderCartUI();
      if (msg) showToast(msg);
      conns.forEach(c => c.send({ type: 'SYNC', cart: cart, msg: msg }));
    }

    function addDish(name, price) {
      if (!roomId) {
        // 房長自己點
        updateCart(name, price, nickname);
        broadcastCart(`🔔 ${nickname} 點了 ${name}！`);
      } else {
        // 團員發給房長
        if (hostConn && hostConn.open) {
          hostConn.send({ type: 'ACTION', item: name, price: price, user: nickname });
        }
      }
    }

    function updateCart(name, price, user) {
      if (!cart[name]) {
        cart[name] = { price, qty: 1, users: [user] };
      } else {
        cart[name].qty += 1;
        if (!cart[name].users.includes(user)) cart[name].users.push(user);
      }
    }

    function clearAll() {
      if (!roomId) {
        cart = {};
        broadcastCart(`🗑️ ${nickname} 清空了購物車！`);
      } else {
        if (hostConn && hostConn.open) hostConn.send({ type: 'CLEAR', user: nickname });
      }
    }

    function renderCartUI() {
      const el = document.getElementById("cartItems");
      const totalEl = document.getElementById("totalPrice");
      const keys = Object.keys(cart);

      if (keys.length === 0) {
        el.innerHTML = `<div style="text-align:center; color:#64748b; padding:30px 0;">目前還沒有人點菜喔！</div>`;
        totalEl.innerText = "0";
        return;
      }

      let total = 0;
      let html = "";
      keys.forEach(k => {
        const item = cart[k];
        const sub = item.price * item.qty;
        total += sub;
        const usersBadge = item.users.map(u => `<span class="who-tag">${u}</span>`).join('');
        html += `
          <div class="cart-item">
            <div>
              <div style="font-weight:bold;">${k} x ${item.qty}</div>
              <div style="margin-top:2px;">${usersBadge}</div>
            </div>
            <div style="font-weight:bold; color:#f87171;">$${sub}</div>
          </div>
        `;
      });
      el.innerHTML = html;
      totalEl.innerText = total.toLocaleString();
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.innerText = msg;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 2500);
    }

    function shareRoom() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert("已複製房間連結！貼到 LINE 群組，朋友點開就能一起即時點餐囉！");
      });
    }

    // 抽籤盲盒拉霸
    function rollSlot() {
      const allDishes = [];
      for (let c in menu) menu[c].forEach(d => allDishes.push(d));
      let count = 0;
      const res = document.getElementById("slotResult");
      const timer = setInterval(() => {
        const pick = allDishes[Math.floor(Math.random() * allDishes.length)];
        res.innerText = `轉動中... 👉 ${pick[0]} ($${pick[1]})`;
        count++;
        if (count > 15) {
          clearInterval(timer);
          res.innerHTML = `🎉 恭喜抽中：<strong style="color:#f59e0b;">${pick[0]} ($${pick[1]})</strong>！`;
          addDish(pick[0], pick[1]);
        }
      }, 70);
    }

    // 渲染分類與菜單
    const sel = document.getElementById("catSelect");
    for (let c in menu) {
      let opt = document.createElement("option");
      opt.value = c; opt.innerText = c; sel.appendChild(opt);
    }

    function renderMenu() {
      const cVal = sel.value;
      const container = document.getElementById("menuList");
      container.innerHTML = "";
      const cats = (cVal === "ALL") ? Object.keys(menu) : [cVal];

      cats.forEach(cat => {
        let h = `<div style="font-size:15px; font-weight:bold; color:#60a5fa; margin:16px 0 8px; border-left:3px solid #3b82f6; padding-left:8px;">${cat}</div>`;
        menu[cat].forEach(([name, price]) => {
          h += `
            <div class="item-card">
              <div>
                <div class="item-name">${name}</div>
                <div class="item-price">${price === 0 ? '時價' : '$' + price}</div>
              </div>
              <button class="btn-add" onclick="addDish('${name}', ${price})">+1 點這道</button>
            </div>
          `;
        });
        container.innerHTML += h;
      });
    }

    function copyOrder() {
      const keys = Object.keys(cart);
      if (keys.length === 0) return alert("購物車是空的！");
      let t = "【漁很大 多人連線點餐清單】\n";
      let tot = 0;
      keys.forEach(k => {
        const item = cart[k];
        tot += item.price * item.qty;
        t += `・${k} x ${item.qty} = $${item.price * item.qty} (點餐人: ${item.users.join(', ')})\n`;
      });
      t += `-------------------------\n合計金額：NT$ ${tot} 元`;
      navigator.clipboard.writeText(t).then(() => alert("已複製到剪貼簿！可直接貼給店家或 LINE。"));
    }

    renderMenu();
  </script>
</body>
</html>
